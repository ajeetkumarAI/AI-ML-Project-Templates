# =========================================================
# CONFIG TEMPLATE
# ---------------------------------------------------------
# This is a YAML file (note the .yaml extension — a config
# file like this should NOT be saved as .py).
#
# HOW TO USE:
#   1. Copy this file and rename it, e.g. config_dev.yaml,
#      config_prod.yaml, config_inference.yaml.
#   2. Fill in the blank paths under `core:` below.
#   3. Load it in code with a small helper, e.g. (using PyYAML):
#
#       import yaml
#       with open("config/config_dev.yaml") as f:
#           config = yaml.safe_load(f)
#
#      (adjust the path if calling this from training/ or inference/,
#      e.g. "../config/config_dev.yaml")
#
#   4. Notice the ${core.xxx} references further down — these
#      are just placeholders showing "this should reuse the
#      core path above". Plain PyYAML does NOT resolve them
#      automatically. Either:
#        a) write the full path directly instead of ${...}, or
#        b) use a config library that supports interpolation,
#           such as OmegaConf (`OmegaConf.load(...)`).
# =========================================================

# CORE PATHS
core:
  s3_path:          # s3 folder location (optional, if syncing to cloud)
  data_base_path:   # data folder location, e.g. ./data
  log_base_path:    # log folder location, e.g. ./logs
  model_base_path:  # artifacts folder location, e.g. ./models

# LOGGING
# See logging_template.py for how these settings are used.
logging:
  root:
    level: DEBUG        # CRITICAL | ERROR | WARNING | INFO | DEBUG
    propagate: False

  handlers:
    console_handler:
      level: DEBUG
      format: default    # must match a key in logging_template.py's LOG_FORMATS dict

    file_handler:
      level: DEBUG
      format: default
      filename: pipeline_   # prefix for the log filename, e.g. pipeline_log_<timestamp>.log

# DATASETS
# Group your files by stage so each script only needs to know
# its own section (raw -> preprocessing, intermediate -> training,
# output -> inference).
datasets:
  ## RAW FILES — the original, untouched input data
  raw:
    dataset1:
      format: csv                                      # csv | excel | parquet | json ...
      uri: ${core.data_base_path}/raw/                  # replace with the actual file path

    dataset2:
      format: excel
      uri: ${core.data_base_path}/raw/

  ## INTERMEDIATE FILES — output of preprocessing, input to training/inference
  intermediate:
    train_processed:
      format: parquet
      uri: ${core.data_base_path}/processed/training/

    inference_processed:
      format: parquet
      uri: ${core.data_base_path}/processed/inference/

  ## OUTPUT FILES — final results written by inference
  output:
    predictions:
      format: csv
      uri: ${core.data_base_path}/output/

# MODELING (optional section — add whatever your project needs)
# modeling:
#   target_column: target
#   test_size: 0.2
#   random_state: 42
